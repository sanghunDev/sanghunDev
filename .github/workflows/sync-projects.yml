# progreneur.com 프로젝트 목록 → README 표 자동 동기화
# 매일 09:00 KST(00:00 UTC) + 수동 실행(workflow_dispatch)
name: sync-projects

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: README 표 동기화
        run: node scripts/sync-projects.mjs
      - name: 변경 시 커밋·푸시
        run: |
          if git diff --quiet README.md; then
            echo "변경 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: 프로젝트 표 자동 동기화 (progreneur.com)"
            git push
          fi
